
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}
.player{
  position:relative;
  width:72%;
  margin:125px auto 0;
  aspect-ratio:16/9;
  background:#111;
  border-radius:6px;
}
.play{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:none;
  border:0;
  color:white;
  font-size:48px;
  cursor:pointer;
}
.top{
  position:absolute;
  top:10px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  color:#ccc;
}
.controls{
  position:absolute;
  bottom:10px;
  left:10px;
  right:10px;
  display:flex;
  align-items:center;
  gap:8px;
  color:#ccc;
  font-size:11px;
}
.bar{
  height:4px;
  background:#eee;
  flex:1;
  border-radius:4px;
}
.link{
  display:block;
  width:max-content;
  margin:32vh auto 0;
  padding:12px 18px;
  color:#fff;
  border:1px solid #777;
  border-radius:8px;
  text-decoration:none;
  font-size:14px;
}
</style>
</head>
<body>
<div class="player">
  <div class="top">
    <span>⛶</span>
    <span>◖))</span>
  </div>
  <button class="play" type="button">▶</button>
  <div class="controls">
    <span>53:15</span>
    <div class="bar"></div>
    <span>-00:00</span>
    <span>▣</span>
    <span>⋯</span>
  </div>
</div>
<a class="link"
 href="https://lite.tiktok.com/t/ZS9PdjKFJmx68-zukJ0/"
 rel="sponsored">
 外部サイトを開く ↗
</a>
</body>
</html>
